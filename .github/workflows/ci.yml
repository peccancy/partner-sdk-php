name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish --no-check-lock
      - name: Lint PHP sources
        run: find src examples -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
